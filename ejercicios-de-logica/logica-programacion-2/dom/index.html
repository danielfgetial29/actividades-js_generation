<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio de Logica - 2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script type="modules" src="scripts.js"></script>
  </head>
  <body>
    <!-- contenedor principal de la pagina -->
    <div class="container">
      <!-- formulario para ingresar los grados -->
      <form>
        <!-- input para ingresar el valor -->
        <div class="mb-3">
          <label for="texto-temperatura" class="form-label">Temperatura</label>
          <input
            type="number"
            class="form-control"
            id="texto-temperatura"
            aria-describedby="ayuda-temperatura"
            placeholder=" Ej. 30"
          />

          <!-- texto guia que indica al usuario que dato ingresar -->
          <div id="ayuda-temperatura" class="form-text">
            Ingrese la temperatura en grados Celsius (°C).
          </div>
        </div>

        <!-- boton para enviar el dato -->
        <button type="submit" class="btn-solid theme-primary">Submit</button>
      </form>
    </div>
  </body>
</html>
