<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de temperatura</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script type="module" src="scripts.js"></script>
  </head>

  <body>
    <div class="container mt-4">
      <h1 class="mb-4">Conversor de temperatura</h1>

      <form id="form-temperatura">
        <div class="mb-3">
          <label for="texto-temperatura" class="form-label">
            Temperatura actual (°C)
          </label>

          <input
            type="number"
            class="form-control"
            id="texto-temperatura"
            placeholder="Ej. 30"
          />

          <div id="ayuda-temperatura" class="form-text">
            Ingresa la temperatura en grados Celsius, sin decimales.
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Convertir</button>
      </form>

      <!-- Resultados -->
      <div id="resultados" class="mt-4" aria-live="polite">
        <p>Temperatura ingresada: <span id="numeroIngresado"></span></p>
        <p>Grados Kelvin: <span id="gradosKelvin"></span></p>
        <p>Grados Fahrenheit: <span id="gradosFahrenheit"></span></p>
      </div>
    </div>
  </body>
</html>
