<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarjeta Personal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--container centra todo el contenido y le da un ancho maximo segun la pantalla-->
    <div class="container">
      <!-- Botones -->
      <button class="btn btn-primary">Boton 1</button>
      <button class="btn btn-success">Boton 2</button>
      <button class="btn btn-danger">Boton 3</button>

      <!-- Parrafos -->
      <p class="text-start">Izquierda</p>
      <p class="text-center text-danger">Centro</p>
      <p class="text-end">Derecha</p>

      <!-- Mi tarjeta -->
      <div class="card mx-auto" style="width: 18rem">
        <div class="card-header text-center fw-bold">Mi Perfil</div>
        <img src="fotoLinkedin.jpg" class="card-img-top" alt="Foto de perfil" />
        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <strong>Nombre:</strong> Daniel Getial
          </li>
          <li class="list-group-item">
            <strong>Ciudad:</strong> Cali - Colombia
          </li>
          <li class="list-group-item"><strong>Edad:</strong> 25 años</li>
        </ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
